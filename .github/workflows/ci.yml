name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=mod
  GOTOOLCHAIN: local

defaults:
  run:
    # Explicit bash runs steps with -eo pipefail. The runner's default,
    # bash -e without pipefail, lets a failing command on the left of a
    # pipe (go test | tee, go tool cover | tail) pass the step.
    shell: bash

jobs:
  build-vet-lint:
    name: build, vet, fmt, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # Linter versions are pinned (and match the Makefile's
      # STATICCHECK_VERSION and GOLANGCI_LINT_VERSION) so a local run with
      # `make tools lint` reports exactly what CI reports. Bump them in both
      # places in one `ci:` commit.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test-race:
    name: test with the race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        run: go test -race -count=1 -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: go tool cover -func=planted-missing.out | tail -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  vectors:
    name: knowledge vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vendored copy is intact and matches the pinned lab commit
        # Offline sha256 check always; the online diff against uspace-lab at
        # the pinned commit is required on main and best-effort elsewhere
        # (a fork without the token reports "unverified", never "ok").
        env:
          LAB_READ_TOKEN: ${{ secrets.LAB_READ_TOKEN }}
          REQUIRE_LAB: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: scripts/check-vectors.sh
      - name: run every vector test
        run: |
          set -o pipefail
          go test -count=1 -run 'Vector|Manifest|Version' -v ./... 2>&1 | tee vectors.log | grep -E '^(--- (FAIL|SKIP)|FAIL|ok)' || { echo "vector tests failed"; exit 1; }
      - name: every manifest file has a vector test
        # G-M1 done-when: each file in the manifest is loaded by the package
        # that owns it. A miss is a warning on branches; on a release tag it
        # fails the build (the tag job runs the same script strictly).
        env:
          STRICT: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: scripts/manifest-coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vectors-log
          path: vectors.log

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: every Fuzz target for 10 s
        run: FUZZTIME=10s scripts/fuzz-smoke.sh
      - name: failing inputs found by the fuzzer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"

  bench:
    name: benchmarks (reported, not gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: run benchmarks
        run: go test -run '^$' -bench . -benchmem -count=1 ./... | tee bench.txt
      - name: compare with targets
        # docs/PLAN.md section 8.6 derives the ns/op targets from the
        # 1000-5000 drone load model. A miss is a warning in the job summary,
        # never a failure: CI runners are noisy and the targets are design
        # budgets, checked for real in the lab's load tests.
        run: scripts/bench-report.sh bench.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.txt

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pinned like the linters (and GOVULNCHECK_VERSION in the Makefile).
      # Fails when the code can reach a known vulnerability; findings only
      # in required modules are printed by -show verbose and do not fail.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -show verbose ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned (and in the Makefile): .gitleaks.toml relies on how this
          # version applies allowlists. Change both together.
          GITLEAKS_VERSION: "8.24.3"

  # Runs only for a v* tag, after every gating job above passed on the
  # tagged commit (go test -race ./..., the vectors, fuzz, vulnerabilities,
  # secrets). docs/RELEASING.md says how a release is cut.
  tag:
    name: tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-vet-lint, test-race, vectors, fuzz-smoke, govulncheck, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Branches and tags, so release-check.sh can see that the tag is
          # on main or release/vN.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: release gate
        # The tag matches the top CHANGELOG heading, nothing is left under
        # Unreleased, the module path fits the major, local_files is empty
        # from v1, every manifest file has a vector test, and the vendored
        # vectors match the lab pin.
        env:
          LAB_READ_TOKEN: ${{ secrets.LAB_READ_TOKEN }}
        run: scripts/release-check.sh "$GITHUB_REF_NAME"
      - name: the published module runs its vectors from a consumer
        run: scripts/consumer-check.sh "$GITHUB_REF_NAME"
      - name: GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-check.sh --notes "$GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; left unchanged"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "uspace-core $GITHUB_REF_NAME" --notes-file notes.md
          fi
