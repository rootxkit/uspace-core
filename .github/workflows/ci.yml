name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=mod
  GOTOOLCHAIN: local

defaults:
  run:
    # Explicit bash runs steps with -eo pipefail. The runner's default,
    # bash -e without pipefail, lets a failing command on the left of a
    # pipe (go test | tee, go tool cover | tail) pass the step.
    shell: bash

jobs:
  build-vet-lint:
    name: build, vet, fmt, lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      # internal/mmapfile has a memory-map build (linux, darwin) and a
      # read fallback (everything else); vet both on every pull request.
      - name: go vet for darwin and windows
        run: |
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
      - name: fixture tests of the helper scripts
        run: scripts/test-scripts.sh
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # Linter versions are pinned (and match the Makefile's
      # STATICCHECK_VERSION and GOLANGCI_LINT_VERSION) so a local run with
      # `make tools lint` reports exactly what CI reports. Bump them in both
      # places in one `ci:` commit.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0

  # The grid loaders on the other two platforms: darwin maps grids like
  # linux, windows takes the read fallback (internal/mmapfile). Reported,
  # not required: the race job above is the gate.
  portable-loaders:
    name: grid loaders on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Nothing is skipped on arm64 (macos-latest): terrain.Tile.ElevationM
      # rounds each product explicitly, so the compiler cannot fuse it into
      # a multiply-add and the exact-metre tests hold on every architecture.
      - name: go test the loaders
        shell: bash
        run: |
          set -o pipefail
          go env GOARCH
          go test -count=1 -shuffle=on -v ./internal/... ./geoid/ ./terrain/ 2>&1 | tee loaders.log
      - name: which path ran
        if: always()
        shell: bash
        run: grep -E -- '--- SKIP|^(ok|FAIL)' loaders.log || true

  # The knowledge vectors and the grid loaders on linux/arm64, where the
  # compiler fuses x*y + z into one multiply-add unless the code forbids
  # it; the vectors job above runs on amd64, which never fuses. A vector
  # that holds on one architecture and not the other fails here.
  vectors-arm64:
    name: knowledge vectors on linux/arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: the architecture under test
        run: test "$(go env GOARCH)" = arm64 && go env GOARCH
      - name: run every vector test
        run: |
          set -o pipefail
          go test -count=1 -run 'Vector|Manifest|Version' -v ./... 2>&1 | tee vectors.log | grep -E '^(--- (FAIL|SKIP)|FAIL|ok)' || { echo "vector tests failed"; exit 1; }
      - name: go test the loaders
        run: |
          set -o pipefail
          go test -count=1 -shuffle=on -v ./internal/... ./geoid/ ./terrain/ 2>&1 | tee loaders.log | grep -E -- '^(--- (FAIL|SKIP)|FAIL|ok)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vectors-arm64-log
          path: |
            vectors.log
            loaders.log

  test-race:
    name: test with the race detector
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        run: go test -race -count=1 -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out

  vectors:
    name: knowledge vectors
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: vendored copy is intact and matches the pinned lab commit
        # Offline sha256 check always; the online diff against uspace-lab at
        # the pinned commit is required on main and best-effort elsewhere
        # (a fork without the token reports "unverified", never "ok").
        env:
          LAB_READ_TOKEN: ${{ secrets.LAB_READ_TOKEN }}
          REQUIRE_LAB: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: scripts/check-vectors.sh
      - name: run every vector test
        run: |
          set -o pipefail
          go test -count=1 -run 'Vector|Manifest|Version' -v ./... 2>&1 | tee vectors.log | grep -E '^(--- (FAIL|SKIP)|FAIL|ok)' || { echo "vector tests failed"; exit 1; }
      - name: every manifest file has a vector test
        # G-M1 done-when: each file in the manifest is loaded by the package
        # that owns it. A miss is a warning on branches; on a release tag it
        # fails the build (the tag job runs the same script strictly).
        env:
          STRICT: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: scripts/manifest-coverage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vectors-log
          path: vectors.log

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: every Fuzz target for 10 s
        run: FUZZTIME=10s scripts/fuzz-smoke.sh
      - name: failing inputs found by the fuzzer
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"

  bench:
    name: benchmarks (reported, not gated)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: run benchmarks
        run: go test -run '^$' -bench . -benchmem -count=1 ./... | tee bench.txt
      - name: compare with targets
        # docs/PLAN.md section 8.6 derives the ns/op targets from the
        # 1000-5000 drone load model. A miss is a warning in the job summary,
        # never a failure: CI runners are noisy and the targets are design
        # budgets, checked for real in the lab's load tests.
        run: scripts/bench-report.sh bench.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench
          path: bench.txt

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Pinned like the linters (and GOVULNCHECK_VERSION in the Makefile).
      # Fails when the code can reach a known vulnerability; findings only
      # in required modules are printed by -show verbose and do not fail.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -show verbose ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # The gitleaks binary itself, checked against a SHA-256 written here
      # (not one fetched beside it), and run without any token: the action
      # wrapper needed GITHUB_TOKEN and was one more third-party step.
      # Pinned (and in the Makefile): .gitleaks.toml relies on how this
      # version applies allowlists. Change the version and the hash
      # together, from the release's gitleaks_<v>_checksums.txt.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "$url"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      # Which commits: on a pull request only its own (base..head), so a
      # finding on another branch never fails it; on main, a tag or a
      # manual run the whole history of the commit checked out, which
      # holds the pushed range. Never every fetched branch (gitleaks'
      # default --all): the checkout fetches them all.
      - name: history and working tree
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="origin/$BASE_REF..$HEAD_SHA"
          else
            range="$GITHUB_SHA"
          fi
          echo "gitleaks commits: $range ($(git rev-list --count "$range") commits)"
          "$RUNNER_TEMP/gitleaks" detect --no-banner --redact --verbose --log-opts="$range"
          "$RUNNER_TEMP/gitleaks" detect --no-banner --redact --verbose --no-git --source .

  # Runs only for a v* tag, after every gating job above passed on the
  # tagged commit (go test -race ./..., the vectors, fuzz, vulnerabilities,
  # secrets). docs/RELEASING.md says how a release is cut.
  tag:
    name: tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-vet-lint, test-race, vectors, fuzz-smoke, govulncheck, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job with a write token: gh release create needs it. Every
    # action it runs is pinned to a commit SHA, and checkout keeps no
    # credential in .git/config.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Branches and tags, so release-check.sh can see that the tag is
          # on main or release/vN.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: release gate
        # The tag matches the top CHANGELOG heading, nothing is left under
        # Unreleased, the module path fits the major, local_files is empty
        # from v1, every manifest file has a vector test, and the vendored
        # vectors match the lab pin.
        env:
          LAB_READ_TOKEN: ${{ secrets.LAB_READ_TOKEN }}
        run: scripts/release-check.sh "$GITHUB_REF_NAME"
      - name: the published module runs its vectors from a consumer
        run: scripts/consumer-check.sh "$GITHUB_REF_NAME"
      - name: GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-check.sh --notes "$GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; left unchanged"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "uspace-core $GITHUB_REF_NAME" --notes-file notes.md
          fi
