name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=mod
  GOTOOLCHAIN: local

jobs:
  build-vet-lint:
    name: build, vet, fmt, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      # Linter versions are pinned (and match the Makefile's
      # STATICCHECK_VERSION and GOLANGCI_LINT_VERSION) so a local run with
      # `make tools lint` reports exactly what CI reports. Bump them in both
      # places in one `ci:` commit.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test-race:
    name: test with the race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        run: go test -race -count=1 -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  vectors:
    name: knowledge vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vendored copy is intact and matches the pinned lab commit
        # Offline sha256 check always; the online diff against uspace-lab at
        # the pinned commit is required on main and best-effort elsewhere
        # (a fork without the token reports "unverified", never "ok").
        env:
          LAB_READ_TOKEN: ${{ secrets.LAB_READ_TOKEN }}
          REQUIRE_LAB: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: scripts/check-vectors.sh
      - name: run every vector test
        run: |
          set -o pipefail
          go test -count=1 -run 'Vector|Manifest|Version' -v ./... 2>&1 | tee vectors.log | grep -E '^(--- (FAIL|SKIP)|FAIL|ok)' || { echo "vector tests failed"; exit 1; }
      - name: every manifest file has a vector test
        # G-M1 done-when: each file in the manifest is loaded by the package
        # that owns it. Until a work package lands, its file is reported as
        # a warning; on a release tag a missing file fails the build.
        run: |
          missing=0
          while read -r file pkg; do
            if ! grep -rq "\"$file\"" "$pkg"/*_test.go 2>/dev/null; then
              echo "::warning::$file is not yet loaded by a test in $pkg/"
              missing=1
            fi
          done < <(go run ./scripts/manifest-list)
          if [ "$missing" = "1" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "a release tag needs every vector file covered"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vectors-log
          path: vectors.log

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: every Fuzz target for 10 s
        run: FUZZTIME=10s scripts/fuzz-smoke.sh
      - name: failing inputs found by the fuzzer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"

  bench:
    name: benchmarks (reported, not gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: run benchmarks
        run: go test -run '^$' -bench . -benchmem -count=1 ./... | tee bench.txt
      - name: compare with targets
        # docs/PLAN.md section 8.6 derives the ns/op targets from the
        # 1000-5000 drone load model. A miss is a warning in the job summary,
        # never a failure: CI runners are noisy and the targets are design
        # budgets, checked for real in the lab's load tests.
        run: scripts/bench-report.sh bench.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.txt

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned (and in the Makefile): .gitleaks.toml relies on how this
          # version applies allowlists. Change both together.
          GITLEAKS_VERSION: "8.24.3"
