# gitleaks configuration for uspace-core: the default rules plus two
# narrow rule allowlists. Read by gitleaks (and gitleaks-action) from the
# repository root.
#
# There is deliberately no global [allowlist]. gitleaks 8.24.3 (the
# version gitleaks-action@v2 runs) ignores condition = "AND" on the global
# allowlist, so a path there exempts every file it matches from every
# rule. Allowlists on a rule honour the condition and touch that rule
# only.
title = "uspace-core"

[extend]
useDefault = true

# The vendored knowledge vectors carry EU operator registration numbers in
# their public form ("compare_key": the number with the three secret
# characters already stripped, LESSONS G-05). The generic-api-key rule
# reads the key name as a credential. These values are public by design
# and the files may only change through scripts/sync-vectors.sh, so the
# exemption is limited to that rule, to compare_key lines and to those
# files: any other secret in a vector file is still reported.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "public operator numbers in the vendored vectors"
condition = "AND"
paths = ['''^vectors/testdata/[^/]+\.json$''']
regexTarget = "line"
regexes = ['''"compare_key"\s*:''']

# jwt_verify.json (WP-11) carries test JWTs signed by a key generated at
# run time by auth/internal/genvectors and discarded, so they grant
# nothing anywhere; only the public JWKS is kept (spec 06 section 4). The
# exemption is scoped to the jwt rule and to that one file: a JWT anywhere
# else is still reported.
[[rules]]
id = "jwt"
[[rules.allowlists]]
description = "discarded-key test tokens in the jwt_verify vector"
paths = ['''^vectors/testdata/jwt_verify\.json$''']
